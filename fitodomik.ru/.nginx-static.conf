if ($host = www.fitodomik.ru) {
    return 308 https://fitodomik.ru$request_uri;
if ($scheme = http) {
    return 308 https://fitodomik.ru$request_uri;
}
location = /index.php {
    return 301 /$is_args$args;
}
location = /index.html {
    return 301 /$is_args$args;
}
location = /index.htm {
    return 301 /$is_args$args;
}
location = /logs { return 404; }
location ^~ /logs/ { return 404; }
location ^~ /vendor/ {
    return 404;
}
location = /composer.json {
    return 404;
}
location = /composer.lock {
    return 404;
}
location = /llms.txt {
    try_files $uri =404;
    charset utf-8;
    default_type text/markdown;
    expires off;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
}
location = /pages/news/ { rewrite ^ /pages/news/index.php last; }
location = /pages/info/ { rewrite ^ /pages/info/index.php last; }
location = /pages/galery/ { rewrite ^ /pages/galery/index.php last; }
location = /pages/components/ { rewrite ^ /pages/components/index.php last; }
location = /pages/code/ { rewrite ^ /pages/code/index.php last; }
location = /pages/feedback/ { rewrite ^ /pages/feedback/index.php last; }
location = /pages/device/ { rewrite ^ /pages/device/index.php last; }
location ~* ^/pages/components/([A-Za-z0-9_-]+)/?$ {
    rewrite ^/pages/components/([A-Za-z0-9_-]+)/?$ /pages/components/$1/index.php last;
}
location ^~ /uploads/farm_photos/ {
    rewrite ^/uploads/farm_photos/([A-Za-z0-9._-]+\.(?:png|jpe?g|gif|webp))$ /security/image.php?file=farm_photos/$1? last;
    return 404;
}
location ^~ /media/farm_photos/ {
    rewrite ^/media/farm_photos/([A-Za-z0-9._-]+\.(?:png|jpe?g|gif|webp))$ /security/image.php?file=farm_photos/$1? last;
    return 404;
}
location ~* ^/media/(?:avatars)/[A-Za-z0-9._-]+\.(?:png|jpe?g|gif|webp)$ {
    try_files $uri =404;
    expires off;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
}
location ~* \.(?:css|js|woff|woff2|png|jpg|jpeg|gif|svg|webp|avif|ico|glb|gltf|webmanifest)$ {
    try_files $uri =404;
    charset utf-8;
    charset_types text/css application/javascript application/manifest+json;
    expires off;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
}
