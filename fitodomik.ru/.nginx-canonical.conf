server {
    listen 80;
    listen [::]:80;
    server_name fitodomik.ru www.fitodomik.ru;
    return 308 https://fitodomik.ru$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.fitodomik.ru;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://fitodomik.ru$request_uri;
}
